<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-labelledby="esmTitle esmDesc">
  <!-- EscrowScope — production mark (currentColor build)
       Identical geometry to logo-final.svg. Set CSS `color` on a parent
       element to theme for light or dark backgrounds, print, or a
       single-color terminal/screenshot stamp — no fixed fills. -->
  <title id="esmTitle">EscrowScope icon</title>
  <desc id="esmDesc">A ring shaped like the bowl of a lowercase "e" doubling as a lens, crossed by a ledger line that exits the ring and ends in a checkpoint dot.</desc>
  <g fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 66.37 59.23 A 27 27 0 1 1 66.37 40.77"/>
    <line x1="15" y1="50" x2="85" y2="50"/>
  </g>
  <circle cx="85" cy="50" r="5.5" fill="currentColor" stroke="none"/>
</svg>
